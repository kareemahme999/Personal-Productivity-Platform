# Aura API — deploy this service on Render (or Railway / Fly.io).
# GitHub Pages cannot host this backend.
#
# 1. Create a PostgreSQL database on Render.
# 2. Create a Web Service from this repo, root directory: backend
# 3. Set the environment variables listed in backend/.env.example
#    CORS_ORIGIN must include your GitHub Pages origin, e.g. https://USER.github.io
#    CLIENT_URL should be the public frontend URL.

services:
  - type: web
    name: aura-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: API_URL
        sync: false

databases:
  - name: aura-db
    plan: free
    databaseName: aura
    user: aura
